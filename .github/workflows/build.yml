name: Montar app (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ValeACorrida.xcodeproj \
            -scheme ValeACorrida \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Empacotar IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/ValeACorrida.app
          ls -la "$APP" "$APP/PlugIns" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ValeACorrida.ipa Payload
          ls -la ValeACorrida.ipa

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ValeACorrida-ipa
          path: ValeACorrida.ipa

      - name: Publicar para download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vale a Corrida · build ${{ github.run_number }}
          body: Baixe o arquivo ValeACorrida.ipa e instale com o Sideloadly.
          files: ValeACorrida.ipa
          make_latest: true
